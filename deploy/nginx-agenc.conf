# AGENCY — reverse proxy for the website + provisioning API.
# Serves the same origin on :80 and forwards to the API on :8080.
# TLS (443) can be layered on later (e.g. certbot/nginx), or you can
# terminate at the router and keep this plain.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}